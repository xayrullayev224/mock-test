<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ElitePrep — IELTS Prep v6</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48;
            --bg: #fdfdfd;
            --text: #0f172a;
            --muted: #64748b;
            --border: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .dashboard {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .start-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 18px;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
        }

        .test-ui {
            display: none;
            flex-direction: column;
            height: 100%;
            background: white;
            z-index: 9999;
            position: fixed;
            inset: 0;
        }

        .test-top {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .timer {
            font-family: monospace;
            font-weight: 900;
            color: var(--primary);
            background: #fff1f2;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .test-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8fafc;
            padding-bottom: 100px;
        }

        .q-view {
            background: white;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: white;
            border-top: 1px solid var(--border);
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 800;
        }

        textarea {
            width: 100%;
            height: 320px;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 16px;
        }

        .option {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 8px;
            background: #fff;
            cursor: pointer;
        }

        .option.active {
            background: #fff1f2;
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 700;
        }

        .passage-box {
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* Tiiny.host banner yashirish */
        div[style*="z-index: 2147483647"],
        iframe,
        [id*="tiiny"] {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
        }
    </style>
</head>

<body>

    <div class="app">
        <div id="dashboard-view" class="dashboard">
            <div class="card">
                <h1 style="font-weight:900; font-size:32px; margin-bottom:10px;">IELTS <span
                        style="color:var(--primary)">Prep</span></h1>
                <p style="color:var(--muted); font-size:14px; margin-bottom:30px;">Professional Cambridge Simulation</p>
                <div style="background:#f8fafc; border-radius:16px; padding:15px; margin-bottom:20px;">
                    <p style="font-weight:700; font-size:15px;">Full Mock Test #1</p>
                    <p style="font-size:12px; color:var(--muted);">L(40), R(40), W(Task 2)</p>
                </div>
                <button class="start-btn" onclick="startTest()">START FULL TEST</button>
            </div>
        </div>

        <div id="test-view" class="test-ui">
            <div class="test-top">
                <div id="section-name" style="font-weight:900; font-size:16px; color:var(--primary)">LISTENING</div>
                <div class="timer" id="timer-text">40:00</div>
            </div>
            <div class="test-container" id="test-content"></div>
            <div class="footer-action">
                <button class="main-btn" id="footer-btn" onclick="handleNavigation()">CONTINUE ➔</button>
            </div>
        </div>
    </div>

    <script id="mock-data-script" type="application/json">
{
    "listening": {
        "audio": "https://example.com/listening-audio.mp3",
        "questions": [
            {
                "id": 1,
                "text": "What is the main purpose of the conversation between the man and Sadie Jones?",
                "options": [
                    "To discuss a survey on transport",
                    "To talk about a new job opportunity",
                    "To review a product"
                ],
                "ans": "To discuss a survey on transport"
            },
            {
                "id": 2,
                "text": "How did Sadie Jones travel to the city centre on the day of the conversation?",
                "options": [
                    "By car",
                    "By bus",
                    "By bike"
                ],
                "ans": "By bus"
            },
            {
                "id": 3,
                "text": "Why did Sadie stop driving?",
                "options": [
                    "Because parking was difficult to find and expensive",
                    "Because she didn't have a car",
                    "Because she preferred cycling"
                ],
                "ans": "Because parking was difficult to find and expensive"
            },
            {
                "id": 4,
                "text": "What is one of the roles that volunteers can take up at ACE voluntary organisation?",
                "options": [
                    "Litter collection",
                    "Teaching English",
                    "Fundraising"
                ],
                "ans": "Litter collection"
            },
            {
                "id": 5,
                "text": "What is a requirement for volunteers who want to work with children at ACE?",
                "options": [
                    "Knowing something about nutrition",
                    "Having experience with acting",
                    "Having children of their own"
                ],
                "ans": "Knowing something about nutrition"
            }
        ]
    },
    "reading": {
        "passage": "Urban farming In Paris, urban farmers are trying a soil-free approach to agriculture that uses less space and fewer resources. Could it help cities face the threats to our food supplies? ... (the passage is too long and has been shortened for brevity)",
        "questions": [
            {
                "id": 1,
                "text": "What approach to agriculture are urban farmers in Paris trying?",
                "options": [
                    "Soil-based farming",
                    "Soil-free farming",
                    "Greenhouse farming"
                ],
                "ans": "Soil-free farming"
            },
            {
                "id": 2,
                "text": "What is the size of the urban rooftop farm above the exhibition hall in southern Paris?",
                "options": [
                    "10,000 square metres",
                    "14,000 square metres",
                    "20,000 square metres"
                ],
                "ans": "14,000 square metres"
            },
            {
                "id": 3,
                "text": "How much of the world's fruit and vegetables could potentially be produced using this soil-free method?",
                "options": [
                    "1%",
                    "5-10%",
                    "20%"
                ],
                "ans": "5-10%"
            },
            {
                "id": 4,
                "text": "What is the name of Pascal Hardy's urban agriculture consultancy?",
                "options": [
                    "Agripolis",
                    "Urban Farming",
                    "Sustainable Development"
                ],
                "ans": "Agripolis"
            },
            {
                "id": 5,
                "text": "What is the benefit of the soil-free method in terms of water usage?",
                "options": [
                    "It uses more water than classic intensive farming",
                    "It uses the same amount of water as classic intensive farming",
                    "It uses 90% less water than classic intensive farming"
                ],
                "ans": "It uses 90% less water than classic intensive farming"
            }
        ]
    }
}
</script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let MOCK_DATA = {};
        let idx = 0;
        let timerID = null;

        function startTest() {
            console.log("Start Test Clicked");
            try {
                const raw = document.getElementById('mock-data-script').textContent;
                MOCK_DATA = JSON.parse(raw);
            } catch (e) {
                alert("Data Error. Please reload.");
                return;
            }

            tg.expand();
            // Fullscreen ruxsat berilsa qiladi, bo'lmasa xato bermasdan o'tib ketadi
            try { tg.requestFullscreen(); } catch (e) { console.warn("Fullscreen not supported"); }

            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('test-view').style.display = 'flex';
            loadSection();
        }

        function loadSection() {
            const sections = ['listening', 'reading', 'writing'];
            const sid = sections[idx];
            document.getElementById('section-name').textContent = sid.toUpperCase();
            const content = document.getElementById('test-content');
            content.innerHTML = '<div class="q-view" id="q-view"></div>';
            const qView = document.getElementById('q-view');
            const data = MOCK_DATA[sid] || {};

            if (sid === 'listening') {
                qView.innerHTML = `<h3>Part 1-4</h3><br><audio controls style="width:100%"><source src="${data.audio || ''}"></audio><br>` +
                    (data.questions || []).map(q => `<div style="margin-bottom:20px;"><b>Q${q.id}. ${q.text}</b>` +
                        (q.options || []).map(o => `<div class="option" onclick="selectOpt(this)">${o}</div>`).join('') + `</div>`).join('');
            } else if (sid === 'reading') {
                qView.innerHTML = `<div class="passage-box">${data.passage || ''}</div>` +
                    (data.questions || []).map(q => `<div style="margin-bottom:20px;"><b>Q${q.id}. ${q.text}</b>` +
                        (q.options || []).map(o => `<div class="option" onclick="selectOpt(this)">${o}</div>`).join('') + `</div>`).join('');
            } else {
                qView.innerHTML = `<div class="passage-box"><b>Prompt:</b><br>${MOCK_DATA.writing?.prompt || ''}</div><textarea id="essay"></textarea>`;
            }
            document.getElementById('footer-btn').textContent = idx < 2 ? "NEXT SECTION ➔" : "FINISH TEST";
        }

        function selectOpt(el) { el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('active')); el.classList.add('active'); }
        function handleNavigation() { if (idx < 2) { idx++; loadSection(); document.getElementById('test-content').scrollTop = 0; } else { finish(); } }
        function finish() { tg.sendData(JSON.stringify({ type: 'mock_test_results', writing: document.getElementById('essay')?.value || '' })); }
    </script>
</body>

</html>
