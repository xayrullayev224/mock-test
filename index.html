<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ElitePrep — IELTS Prep</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48;
            --bg: #fdfdfd;
            --text: #0f172a;
            --muted: #64748b;
            --border: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .dashboard {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            background-image: radial-gradient(#e11d4808 1.5px, transparent 1px);
            background-size: 24px 24px;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-logo h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .header-logo h1 span {
            color: var(--primary);
        }

        .header-logo p {
            font-size: 14px;
            color: var(--muted);
            margin-top: 5px;
        }

        .test-list {
            display: grid;
            gap: 20px;
        }

        .card {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            transition: 0.3s;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: #fff1f2;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .card p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .start-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
            border: none;
            cursor: pointer;
        }

        /* TEST UI */
        .test-ui {
            display: none;
            flex-direction: column;
            height: 100%;
            background: white;
            z-index: 1000;
            position: fixed;
            inset: 0;
        }

        .test-top {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            font-family: monospace;
            font-weight: 900;
            color: var(--primary);
            background: #fff1f2;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .test-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8fafc;
        }

        .q-view {
            background: white;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 80px;
        }

        .q-item {
            margin-bottom: 28px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 20px;
        }

        .q-label {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 14px;
            display: block;
            color: #1e293b;
        }

        .option {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option.active {
            background: #fff1f2;
            border-color: var(--primary);
            font-weight: 700;
            color: var(--primary);
        }

        .passage-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 15px;
            line-height: 1.8;
            border-left: 5px solid var(--primary);
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: white;
            border-top: 1px solid var(--border);
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 320px;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            font-family: inherit;
            resize: none;
            outline: none;
            background: #fff;
            font-size: 16px;
            line-height: 1.6;
        }

        /* Tiiny hide */
        div[style*="z-index: 2147483647"],
        [id*="tiiny"],
        iframe[src*="tiiny"] {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="app">
        <!-- DASHBOARD -->
        <div id="dashboard-view" class="dashboard">
            <div class="header-logo">
                <h1>IELTS <span>Prep</span></h1>
                <p>The Ultimate 40:40 Practice Simulation.</p>
            </div>
            <div class="test-list">
                <div class="card">
                    <div class="card-icon">📚</div>
                    <h3>Cambridge 18 Full Test</h3>
                    <p>Real L (40), R (40), W sequence + Speaking Session.</p><button class="start-btn"
                        onclick="startMock()">Start Full Test</button>
                </div>
            </div>
        </div>

        <!-- TEST INTERFACE -->
        <div id="test-view" class="test-ui">
            <div class="test-top">
                <div id="section-name" style="font-weight:900; font-size:16px; color:var(--primary)">LISTENING</div>
                <div class="timer" id="timer-text">40:00</div>
            </div>
            <div class="test-container" id="test-content"></div>
            <div class="footer-action"><button class="main-btn" id="footer-btn" onclick="handleNavigation()">Continue
                    ➔</button></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // 🏆 FULL 40-40 DATA STRUCTURE
        const MOCK_DATA = Since there are no specific questions for the reading and listening sections provided in the prompt, I'll create some sample questions based on the given texts and audio transcripts. Please note that these questions are not actual IELTS test questions but rather examples created for demonstration purposes.


{
  "listening": {
    "audio": "https://example.com/ielts-listening-audio.mp3",
    "questions": [
      {
        "id": 1,
        "text": "What is the main purpose of the survey being conducted by the man?",
        "options": ["To gather information about transport", "To promote a new product", "To conduct market research"],
        "ans": "To gather information about transport"
      },
      {
        "id": 2,
        "text": "How does Sadie usually travel to the city centre?",
        "options": ["By car", "By bus", "By train"],
        "ans": "By bus"
      },
      {
        "id": 3,
        "text": "What is the minimum age requirement to volunteer for ACE?",
        "options": ["16", "18", "21"],
        "ans": "16"
      },
      {
        "id": 4,
        "text": "What type of activity does ACE need volunteers for, which involves working with children?",
        "options": ["Litter collection", "Fundraising", "Helping children learn about staying healthy"],
        "ans": "Helping children learn about staying healthy"
      },
      {
        "id": 5,
        "text": "What is the speaker's message to the audience regarding the job market?",
        "options": ["It's highly competitive", "It's easy to get a job", "It's not relevant to their field of study"],
        "ans": "It's highly competitive"
      }
    ]
  },
  "reading": {
    "passage": "Urban farming In Paris, urban farmers are trying a soil-free approach to agriculture that uses less space and fewer resources... (insert the entire passage here)",
    "questions": [
      {
        "id": 1,
        "text": "What is the main topic of the passage?",
        "options": ["Urban farming", "Space junk", "Forest management"],
        "ans": "Urban farming"
      },
      {
        "id": 2,
        "text": "According to Pascal Hardy, what percentage of food consumption could be targeted by urban farming?",
        "options": ["1-5%", "5-10%", "10-20%"],
        "ans": "5-10%"
      },
      {
        "id": 3,
        "text": "What is the advantage of produce grown using the soil-free method?",
        "options": ["It travels a long distance to reach the consumer", "It is treated with many pesticides", "It is produced locally and has a lower carbon footprint"],
        "ans": "It is produced locally and has a lower carbon footprint"
      },
      {
        "id": 4,
        "text": "What is the term used to describe the practice of removing high-quality trees and leaving behind low-use trees?",
        "options": ["High-grading", "Low-grading", "Selective cutting"],
        "ans": "High-grading"
      },
      {
        "id": 5,
        "text": "What is the purpose of a Timber Stand Improvement (TSI) Cut?",
        "options": ["To remove all mature trees", "To remove low-use trees and promote healthy growth", "To harvest trees for timber"],
        "ans": "To remove low-use trees and promote healthy growth"
      }
    ]
  }
}


Please note that you should replace the "https://example.com/ielts-listening-audio.mp3" URL with the actual audio file URL. Also, the questions and answers provided are just examples and may not be accurate or suitable for actual IELTS testing purposes.;

    const TIMES = { listening: 40 * 60, reading: 60 * 60, writing: 60 * 60 };
        let currentSections = ['listening', 'reading', 'writing'];
        let idx = 0;
        let secs = 0;
        let timerID = null;

        function startMock() {
            tg.expand();
            try { tg.requestFullscreen(); } catch (e) { }
            idx = 0;
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('test-view').style.display = 'flex';
            loadSection();
        }

        function loadSection() {
            const sid = currentSections[idx];
            document.getElementById('section-name').textContent = sid.toUpperCase();
            const content = document.getElementById('test-content');
            content.innerHTML = '<div class="q-view" id="q-view"></div>';
            const qView = document.getElementById('q-view');

            if (sid === 'listening') {
                qView.innerHTML = `<h3>Part 1-4</h3><br><audio controls style="width:100%"><source src="${MOCK_DATA.listening.audio}"></audio><br>` +
                    MOCK_DATA.listening.questions.map(q => `
                    <div class="q-item"><span class="q-label">Q${q.id}. ${q.text}</span>
                    ${q.options.map(o => `<div class="option" onclick="selectOpt(this, 'l${q.id}')">${o}</div>`).join('')}</div>
                `).join('');
            } else if (sid === 'reading') {
                qView.innerHTML = MOCK_DATA.reading.passages.map(p => `<div class="passage-box"><b>${p.title}</b><br>${p.text}</div>`).join('') +
                    MOCK_DATA.reading.questions.map(q => `
                    <div class="q-item"><span class="q-label">Q${q.id}. ${q.text}</span>
                    ${q.options.map(o => `<div class="option" onclick="selectOpt(this, 'r${q.id}')">${o}</div>`).join('')}</div>
                `).join('');
            } else {
                qView.innerHTML = `<div class="passage-box">${MOCK_DATA.writing.prompt}</div><textarea id="essayBox" placeholder="Write essay (250+ words)..." oninput="updateWC()"></textarea><p style="margin-top:5px; font-weight:700;">Words: <span id="wc">0</span></p>`;
            }

            secs = TIMES[sid];
            if (timerID) clearInterval(timerID);
            timerID = setInterval(() => {
                if (secs <= 0) { handleNavigation(); return; }
                secs--;
                const m = Math.floor(secs / 60); const s = secs % 60;
                document.getElementById('timer-text').textContent = (m < 10 ? '0' : '') + m + ":" + (s < 10 ? '0' : '') + s;
            }, 1000);
            document.getElementById('footer-btn').textContent = idx < 2 ? "Go to Next Section ➔" : "💾 Submit My Test";
        }

        function selectOpt(el, qid) { el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('active')); el.classList.add('active'); }
        function updateWC() { const v = document.getElementById('essayBox').value.trim(); document.getElementById('wc').textContent = v ? v.split(/\s+/).length : 0; }
        function handleNavigation() { if (idx < 2) { idx++; loadSection(); document.getElementById('test-content').scrollTop = 0; } else { submit(); } }
        function submit() {
            clearInterval(timerID);
            const results = { type: 'mock_test_results', writing: document.getElementById('essayBox').value, test_name: "Cambridge 18 - 40/40 Edition" };
            tg.sendData(JSON.stringify(results));
        }
    </script>
</body>

</html>
