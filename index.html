<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IELTS Online Simulation</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --red: #e11d48;
            --green: #16a34a;
            --bg: #f3f4f6;
            --border: #d1d5db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Official Header */
        header {
            background: #fff;
            border-bottom: 2px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            background: #000;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
        }

        /* Main Layout */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fff;
            margin: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        /* Question Styles */
        .passage {
            line-height: 1.8;
            color: #1f2937;
            margin-bottom: 30px;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .question-row {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .q-num {
            background: #e5e7eb;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"] {
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
            width: 200px;
            transition: border 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px #dbeafe;
        }

        /* Bottom Navigation (Official Style) */
        .bottom-nav {
            background: #fff;
            border-top: 2px solid var(--border);
            padding: 10px;
            display: flex;
            overflow-x: auto;
            gap: 8px;
            white-space: nowrap;
        }

        .nav-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #f9fafb;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .nav-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .nav-btn.completed {
            border-bottom: 3px solid var(--green);
        }

        /* Dashboard */
        #dashboard {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .start-card {
            background: #fff;
            border: 2px solid #000;
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }

        .official-btn {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* Hidden UI */
        .hidden {
            display: none !important;
        }

        /* Tiiny host bypass */
        #tiiny-host-banner,
        div[style*="z-index: 2147483647"] {
            display: none !important;
            visibility: hidden !important;
        }
    </style>
</head>

<body>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard">
        <div class="start-card">
            <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 10px;">IELTS <span>ONLINE</span></h1>
            <p style="color: #666; margin-bottom: 30px;">This is a computer-delivered IELTS simulation.</p>
            <div style="background: #f3f4f6; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left;">
                <p><strong>Test:</strong> Cambridge Assessment English</p>
                <p><strong>Format:</strong> L, R, W + AI Speaking</p>
            </div>
            <button class="official-btn" onclick="startOfficialTest()">Start Test</button>
        </div>
    </div>

    <!-- TEST VIEW -->
    <header class="hidden" id="test-header">
        <div style="font-weight: 800; font-size: 18px;">IELTS Simulation</div>
        <div class="timer" id="timer">40:00</div>
    </header>

    <div class="main-container hidden" id="test-main">
        <div id="audio-container" style="padding: 10px 20px; background: #f9fafb; border-bottom: 1px solid #ddd;"
            class="hidden">
            <audio id="test-audio" controls style="width: 100%; height: 35px;"></audio>
        </div>

        <div class="content-area" id="ques-container">
            <!-- Questions load here -->
        </div>

        <div class="bottom-nav" id="parts-nav">
            <!-- Parts like Part 1, Part 2, etc -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let ALL_DATA = {};
        let currentMode = 'listening'; // listening, reading, writing
        let currentPart = 0; // 0=Part 1, 1=Part 2...
        let timerID = null;
        let seconds = 0;

        function startOfficialTest() {
            try {
                const raw = document.getElementById('mock-data-script').textContent;
                ALL_DATA = JSON.parse(raw);
            } catch (e) { alert("Data error. Reloading..."); return; }

            tg.expand();
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('test-header').classList.remove('hidden');
            document.getElementById('test-main').classList.remove('hidden');

            initSection('listening');
        }

        function initSection(mode) {
            currentMode = mode;
            currentPart = 0;

            if (mode === 'listening') {
                seconds = 30 * 60;
                document.getElementById('audio-container').classList.remove('hidden');
                document.getElementById('test-audio').src = ALL_DATA.listening?.audio || "";
            } else {
                seconds = 60 * 60;
                document.getElementById('audio-container').classList.add('hidden');
            }

            renderNav();
            renderPart();
            startTimer();
        }

        function renderNav() {
            const nav = document.getElementById('parts-nav');
            nav.innerHTML = '';
            const partsCount = currentMode === 'writing' ? 1 : 4;

            for (let i = 0; i < partsCount; i++) {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${i === currentPart ? 'active' : ''}`;
                btn.textContent = currentMode === 'writing' ? 'Writing Task' : `Part ${i + 1}`;
                btn.onclick = () => { currentPart = i; renderNav(); renderPart(); };
                nav.appendChild(btn);
            }

            // Next Section Button
            const nextBtn = document.createElement('button');
            nextBtn.className = 'nav-btn';
            nextBtn.style.background = '#000';
            nextBtn.style.color = '#fff';
            nextBtn.textContent = 'Next Section ➔';
            nextBtn.onclick = switchToNextSection;
            nav.appendChild(nextBtn);
        }

        function renderPart() {
            const container = document.getElementById('ques-container');
            container.innerHTML = '';
            const data = ALL_DATA[currentMode];

            if (currentMode === 'writing') {
                container.innerHTML = `<div class="passage"><strong>Task:</strong><br>${data.prompt}</div>
                                   <textarea style="width:100%; height:400px; padding:15px; border-radius:4px; border:1px solid #ccc; font-size:16px; outline:none;" placeholder="Type your answer here..."></textarea>`;
                return;
            }

            if (currentMode === 'reading') {
                const pass = document.createElement('div');
                pass.className = 'passage';
                pass.innerHTML = data.passage || "";
                container.appendChild(pass);
            }

            // Render roughly 10 questions per part
            const startQ = currentPart * 10;
            const endQ = startQ + 10;
            const slice = (data.questions || []).slice(startQ, endQ);

            slice.forEach(q => {
                const row = document.createElement('div');
                row.className = 'question-row';
                row.innerHTML = `<span class="q-num">${q.id}</span> 
                             <span style="font-size:14px;">${q.text}</span> 
                             <input type="text" placeholder="Type answer...">`;
                container.appendChild(row);
            });
        }

        function startTimer() {
            if (timerID) clearInterval(timerID);
            timerID = setInterval(() => {
                if (seconds <= 0) { switchToNextSection(); return; }
                seconds--;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                document.getElementById('timer').textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        function switchToNextSection() {
            if (currentMode === 'listening') initSection('reading');
            else if (currentMode === 'reading') initSection('writing');
            else finishTest();
        }

        function finishTest() {
            clearInterval(timerID);
            tg.sendData(JSON.stringify({ type: 'mock_test_results', info: 'Student finished formal test' }));
        }
    </script>
