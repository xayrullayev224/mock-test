<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ElitePrep — IELTS Prep</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48;
            --bg: #fdfdfd;
            --text: #0f172a;
            --muted: #64748b;
            --border: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .dashboard {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            background-image: radial-gradient(#e11d4808 1.5px, transparent 1px);
            background-size: 24px 24px;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-logo h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .header-logo h1 span {
            color: var(--primary);
        }

        .header-logo p {
            font-size: 14px;
            color: var(--muted);
            margin-top: 5px;
        }

        .card {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            margin-top: 20px;
        }

        .card h3 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .card p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .start-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .test-ui {
            display: none;
            flex-direction: column;
            height: 100%;
            background: white;
            z-index: 1000;
            position: fixed;
            inset: 0;
        }

        .test-top {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            font-family: monospace;
            font-weight: 900;
            color: var(--primary);
            background: #fff1f2;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .test-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8fafc;
        }

        .q-view {
            background: white;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 80px;
        }

        .q-label {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 14px;
            display: block;
            color: #1e293b;
        }

        .option {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 8px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
        }

        .option.active {
            background: #fff1f2;
            border-color: var(--primary);
            font-weight: 700;
            color: var(--primary);
        }

        .passage-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            line-height: 1.8;
            border-left: 5px solid var(--primary);
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: white;
            border-top: 1px solid var(--border);
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
        }

        textarea {
            width: 100%;
            height: 320px;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            font-family: inherit;
            resize: none;
            outline: none;
            background: #fff;
            font-size: 16px;
        }

        div[style*="z-index: 2147483647"],
        [id*="tiiny"],
        iframe[src*="tiiny"] {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="app">
        <div id="dashboard-view" class="dashboard">
            <div class="header-logo">
                <h1>IELTS <span>Prep</span></h1>
                <p>Full 40:40 Mock Test Simulation.</p>
            </div>
            <div class="card">
                <h3>Ready for Cambridge Mock?</h3>
                <p id="test-info-text">Listening (40), Reading (40), Writing. Accurate AI Scoring.</p>
                <button class="start-btn" onclick="safeStart()">Start Full Test</button>
            </div>
        </div>

        <div id="test-view" class="test-ui">
            <div class="test-top">
                <div id="section-name" style="font-weight:900; font-size:16px; color:var(--primary)">LISTENING</div>
                <div class="timer" id="timer-text">40:00</div>
            </div>
            <div class="test-container" id="test-content"></div>
            <div class="footer-action"><button class="main-btn" id="footer-btn" onclick="handleNavigation()">Continue
                    ➔</button></div>
        </div>
    </div>

    <!-- SAFE DATA STORAGE -->

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let MOCK_DATA = {};
        const TIMES = { listening: 40 * 60, reading: 60 * 60, writing: 60 * 60 };
        let currentSections = ['listening', 'reading', 'writing'];
        let idx = 0;
        let secs = 0;
        let timerID = null;

        // DATAni xavfsiz o'qish
        try {
            const rawJson = document.getElementById('mock-data-script').textContent;
            MOCK_DATA = JSON.parse(rawJson);
        } catch (e) {
            console.error("JSON Error", e);
        }

        function safeStart() {
            if (!MOCK_DATA.listening && !MOCK_DATA.reading) {
                alert("No test data found. Please wait 30s for GitHub deployment.");
                return;
            }
            tg.expand();
            try { tg.requestFullscreen(); } catch (e) { }
            idx = 0;
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('test-view').style.display = 'flex';
            loadSection();
        }

        function loadSection() {
            const sid = currentSections[idx];
            document.getElementById('section-name').textContent = sid.toUpperCase();
            const content = document.getElementById('test-content');
            content.innerHTML = '<div class="q-view" id="q-view"></div>';
            const qView = document.getElementById('q-view');

            const data = MOCK_DATA[sid];

            if (sid === 'listening') {
                qView.innerHTML = `<h3>Listening Part 1-4</h3><br><audio controls style="width:100%"><source src="${data?.audio || ''}"></audio><br>` +
                    (data?.questions || []).map(q => `
                    <div class="q-item"><span class="q-label">Q${q.id}. ${q.text}</span>
                    ${(q.options || []).map(o => `<div class="option" onclick="selectOpt(this, 'l${q.id}')">${o}</div>`).join('')}</div>
                `).join('');
            } else if (sid === 'reading') {
                qView.innerHTML = `<div class="passage-box">${data?.passage || ''}</div>` +
                    (data?.questions || []).map(q => `
                    <div class="q-item"><span class="q-label">Q${q.id}. ${q.text}</span>
                    ${(q.options || []).map(o => `<div class="option" onclick="selectOpt(this, 'r${q.id}')">${o}</div>`).join('')}</div>
                `).join('');
            } else {
                qView.innerHTML = `<div class="passage-box">${MOCK_DATA.writing?.prompt || ''}</div><textarea id="essayBox" placeholder="Write essay..." oninput="updateWC()"></textarea><p style="margin-top:5px; font-weight:700;">Words: <span id="wc">0</span></p>`;
            }

            secs = TIMES[sid];
            if (timerID) clearInterval(timerID);
            timerID = setInterval(() => {
                if (secs <= 0) { handleNavigation(); return; }
                secs--;
                const m = Math.floor(secs / 60); const s = secs % 60;
                document.getElementById('timer-text').textContent = (m < 10 ? '0' : '') + m + ":" + (s < 10 ? '0' : '') + s;
            }, 1000);
            document.getElementById('footer-btn').textContent = idx < 2 ? "Go to Next Section ➔" : "💾 Submit My Test";
        }

        function selectOpt(el, qid) { el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('active')); el.classList.add('active'); }
        function updateWC() { const v = document.getElementById('essayBox').value.trim(); document.getElementById('wc').textContent = v ? v.split(/\s+/).length : 0; }
        function handleNavigation() { if (idx < 2) { idx++; loadSection(); document.getElementById('test-content').scrollTop = 0; } else { submit(); } }

        function submit() {
            clearInterval(timerID);
            const results = { type: 'mock_test_results', writing: document.getElementById('essayBox').value, test_name: "AI Cambridge Fetch" };
            tg.sendData(JSON.stringify(results));
        }
    </script>
</body>

</html>
