your answers in boxes on your answer sheet.</em></p>\n<ul>\n<li>Some dead wood is removed to avoid the possibility of <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-22\" class=\"ielts-reading-question-number\">22</strong>  [___] </span>.</li>\n<li>The <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-23\" class=\"ielts-reading-question-number\">23</strong>  [___] </span> from the tops of cut trees can help improve soil quality.</li>\n<li>Some damaged trees should be left, as their <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-24\" class=\"ielts-reading-question-number\">24</strong>  [___] </span> provide habitats for a range of creatures.</li>\n<li>Some trees that are small, such as <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-25\" class=\"ielts-reading-question-number\">25</strong>  [___] </span>, are a source of food for animals and insects.</li>\n<li>Any trees that are <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-26\" class=\"ielts-reading-question-number\">26</strong>  [___] </span> should be left to grow, as they add to the variety of species in the forest.</li>\n</ul>\n</div>\n                                        </div>\n                                        <div class=\"ielts-reading-questions\">\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                    </div>\n                                        </div>                                                                            <div id=\"ielts-reading-question-section-3\" class=\"ielts-reading-question-section current\" data-part-number=\"3\">                                        <h2 class=\"ielts-reading-question-section-heading\"> Questions 27-31 </h2>\n                                        <div class=\"ielts-reading-question-section-content\">\n                                            <p>The Reading Passage has six sections, <strong>A-F</strong>.</p>\n<p>Which section contains the following information?</p>\n<p><em>Write the correct letter,&nbsp;<strong>A-F</strong>, in boxes on your answer sheet.</em></p>\n                                        </div>\n                                        <div class=\"ielts-reading-questions\">\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-27\" class=\"ielts-reading-question-number\">27</strong> <span>a reference to the cooperation that takes place to try and minimise risk</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-28\" class=\"ielts-reading-question-number\">28</strong> <span>an explanation of a person\u2019s aims</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-29\" class=\"ielts-reading-question-number\">29</strong> <span>a description of a major collision that occurred in space</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-30\" class=\"ielts-reading-question-number\">30</strong> <span>a comparison between tracking objects in space and the efficiency of a transportation system</span></span>                                   \n                                                                                                    \n swer.</em></p>\n<p><em>Write your answers in boxes on your answer sheet.</em></p>\n<h3><strong>The Inter-Agency Space Debris Coordination Committee</strong></h3>\n<p>The committee gives advice on how the <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-32\" class=\"ielts-reading-question-number\">32</strong>  [___] </span> of space can be achieved. The committee advises that when satellites are no longer active, any unused <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-33\" class=\"ielts-reading-question-number\">33</strong>  [___] </span> or pressurised material that could cause <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-34\" class=\"ielts-reading-question-number\">34</strong>  [___] </span>&nbsp;should be removed.</p>\n<p>Although operators of large satellite constellations accept that they have obligations as stewards of space, Holger Krag points out that the operators that become <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-35\" class=\"ielts-reading-question-number\">35</strong>  [___] </span>&nbsp;are unlikely to prioritise removing their satellites from space.</p></div>\n                                        </div>\n                                        <div class=\"ielts-reading-questions\">\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                    </div>\n                                                                                                                                                            <h2 class=\"ielts-reading-question-section-heading\"> Questions 36-40 </h2>\n                                        <div class=\"ielts-reading-question-section-content\">\n                                            <p><em>Look at the following statements and the list of people below.</em></p>\n<p><em>Match each statement with the correct person,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>,&nbsp;<strong>C</strong>&nbsp;or&nbsp;<strong>D</strong>.</em></p>\n<p><em>Write the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>,&nbsp;<strong>C</strong>&nbsp;or&nbsp;<strong>D</strong>, in boxes on your answer sheet.</em></p>\n<p><strong><em>NB</em></strong><em>&nbsp;&nbsp;&nbsp;You may use any letter more than once.</em></p>\n<p><strong>List of People</strong></p>\n<p><strong>A&nbsp;</strong>&nbsp;&nbsp;&nbsp;&nbsp;Carolin Frueh</p>\n<p><strong>B&nbsp; &nbsp;</strong>&nbsp;&nbsp;Holger Krag</p>\n<p><strong>C &nbsp;&nbsp;</strong>&nbsp;&nbsp;Marlon Sorge</p>\n<p><strong>D&nbsp; &nbsp;</strong>&nbsp;&nbsp;Moriba Jah</p>\n                                        </div>\n                                        <div class=\"ielts-reading-questions\">\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-36\" class=\"ielts-reading-question-number\">36</strong> <span>Knowing the exact location of space junk would help prevent any possible danger.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-37\" class=\"ielts-reading-question-number\">37</strong> <span>Space should be available to everyone and should be preserved for the future.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-38\" class=\"ielts-reading-question-number\">38</strong> <span>A recommendation regarding satellites is widely ignored.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-39\" class=\"ielts-reading-question-number\">39</strong> <span>There is conflicting information about where some satellites are in space.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-40\" class=\"ielts-reading-question-number\">40</strong> <span>There is a risk we will not be able to undo the damage that occurs in space.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                    </div>\n                                        </div>                                                                    </div>\n                            </form>\n                                            "

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let DATA = {};
        let mode = 'listening';
        let part = 0;
        let seconds = 0;
        let timerID = null;

        function startTest() {
            try {
                const raw = document.getElementById('mock-data-script').textContent;
                DATA = JSON.parse(raw);
            } catch (e) { alert("Data Loading Error"); return; }

            tg.expand();
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('header').classList.remove('hidden');
            document.getElementById('main').classList.remove('hidden');
            document.getElementById('nav').classList.remove('hidden');

            initSect('listening');
        }

        function initSect(s) {
            mode = s; part = 0;
            document.getElementById('sect-title').textContent = s.toUpperCase();
            if (s === 'listening') {
                seconds = 2400;
                document.getElementById('audio-box').classList.remove('hidden');
                document.getElementById('player').src = DATA.listening?.audio || "";
            } else {
                seconds = 3600;
                document.getElementById('audio-box').classList.add('hidden');
            }
            renderNav();
            renderPart();
            startTimer();
        }

        function renderNav() {
            const nav = document.getElementById('nav');
            nav.innerHTML = '';
            const counts = mode === 'listening' ? 4 : (mode === 'reading' ? 3 : 1);

            for (let i = 0; i < counts; i++) {
                const tab = document.createElement('div');
                tab.className = `part-tab ${i === part ? 'active' : ''}`;

                let dotsHTML = '';
                for (let d = 1; d <= 10; d++) dotsHTML += `<div class="dot">${(i * 10) + d}</div>`;

                tab.innerHTML = `<div style="font-weight:bold; font-size:14px;">PART ${i + 1}</div><div class="dot-grid">${dotsHTML}</div>`;
                tab.onclick = () => { part = i; renderNav(); renderPart(); document.getElementById('main').scrollTop = 0; };
                nav.appendChild(tab);
            }

            const next = document.createElement('div');
            next.className = 'part-tab';
            next.style.background = '#000';
            next.style.color = '#fff';
            next.innerHTML = `<div style="font-weight:bold; margin-top:10px">${mode === 'writing' ? 'FINISH' : 'NEXT ➔'}</div>`;
            next.onclick = () => {
                if (mode === 'listening') initSect('reading');
                else if (mode === 'reading') initSect('writing');
                else { tg.close(); }
            };
            nav.appendChild(next);
        }

        function renderPart() {
            const cont = document.getElementById('content');
            cont.innerHTML = '';
            const d = DATA[mode];
            if (!d) return;

            if (mode === 'writing') {
                cont.innerHTML = `<h2 style="margin-bottom:20px">Writing Task 2</h2><div class="passage-area">${d.prompt}</div><textarea style="width:100%; height:400px; padding:15px; border:1px solid #ccc; font-size:16px;" placeholder="Type your essay..."></textarea>`;
                return;
            }

            let html = "";
            let globalQIndex = (part * 10) + 1;

            if (mode === 'reading') {
                const pData = (d.parts && d.parts[part]) ? d.parts[part] : { passage: "", questions: "" };
                html = `<div class="passage-area">${pData.passage}</div><div class="questions-render-box">${pData.questions}</div>`;
            } else {
                html = (d.parts && d.parts[part]) ? d.parts[part] : "";
            }

            // Inline Inputlarni joylashtirish (Gap/Gaplarni to'ldirish uchun)
            let processedHTML = html.replace(/\[___\]/g, () => {
                const el = `<span class="q-gap"><span class="q-gap-num">${globalQIndex}</span><input type="text" class="q-gap-input"></span>`;
                globalQIndex++;
                return el;
            });

            cont.innerHTML = processedHTML;

            // Agar Engovate saytidan kelgan sarlavhalar juda katta bo'lsa, ularni kichiklashtirish
            const headers = cont.querySelectorAll('h1, h2');
            headers.forEach(h => h.style.fontSize = '24px');
        }

        function startTimer() {
            if (timerID) clearInterval(timerID);
            timerID = setInterval(() => {
                if (seconds <= 0) { clearInterval(timerID); return; }
                seconds--;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                document.getElementById('timer').textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }
    </script>
