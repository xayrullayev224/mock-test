            position: relative;

            font-weight: bold;
            font-size: 16px;

            padding: 2px 6px;

            padding: 4px 8px;
            min-width: 140px;
            font-size: 17px;
            outline: none;
        }

        .q-gap-input:focus {

        }

        .passage-area {
            padding: 20px;
            border: 1px solid #eee;
            background: #fff;
            margin-bottom: 25px;
            border-radius: 4px;
        }

            background: #eee;
            border-top: 1px solid #ccc;
            padding: 12px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

            background: #fff;

            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;

            background: #007bff;
            color: #fff;

            margin-top: 5px;
        }

            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #333;
            font-weight: bold;
        }

            color: #007bff;
            border-color: #007bff;
        }

                               <div class=\"ielts-listening-option\"><label class=\"ielts-listening-option-letter\" for=\"ielts_listening_answer_14016_2_4\">E</label><input data-limit=\"2\" type=\"checkbox\" name=\"ielts_listening_answer_14016_2[]\" id=\"ielts_listening_answer_14016_2_4\" value=\"E\"><span>the most popular fashion sizes</span></div>                                         \n                                                                                                                               \n                                                </div>\n                                                                                    </div>\n                                        </div>                                                                            <div id=\"ielts-listening-question-section-4\" class=\"ielts-listening-question-section current\" data-part-number=\"4\">                                        <h2 class=\"ielts-listening-question-section-heading\"> Questions 31-40 </h2>\n                                                                                    \n                                                                                <div class=\"ielts-listening-question-section-content\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><em>Complete the notes below.</em><p></p>\n<p><em>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</em></p>\n<h2><strong>Elephant translocation</strong></h2>\n<p><strong>Reasons for overpopulation at Majete National Park</strong></p>\n<ul>\n<li>strict enforcement of anti-poaching laws</li>\n<li>successful breeding</li>\n</ul>\n<p><strong>Problems caused by elephant overpopulation</strong></p>\n<ul>\n<li>greater competition, causing hunger for elephants</li>\n<li>damage to <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-31\" class=\"ielts-listening-question-number\">31</strong>  [___] </span>&nbsp;in the park</li>\n</ul>\n<p><strong>The translocation process</strong></p>\n<ul>\n<li>a suitable group of elephants from the same <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-32\" class=\"ielts-listening-question-number\">32</strong>  [___] </span>&nbsp;was selected</li>\n<li>vets and park staff made use of <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-33\" class=\"ielts-listening-question-number\">33</strong>  [___] </span>&nbsp;to help guide the elephants into an open plain</li>\n<li>elephants were immobilised with tranquilisers</li>\n</ul>\n<p>\u2013&nbsp; &nbsp;this process had to be completed quickly to reduce <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-34\" class=\"ielts-listening-question-number\">34</strong>  [___] </span></p>\n<p>\u2013 &nbsp;&nbsp;elephants had to be turned on their <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-35\" class=\"ielts-listening-question-number\">35</strong>  [___] </span>&nbsp;to avoid damage to their lungs</p>\n<p>\u2013 &nbsp;&nbsp;elephants\u2019 <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-36\" class=\"ielts-listening-question-number\">36</strong>  [___] </span>&nbsp;had to be monitored constantly</p>\n<p>\u2013 &nbsp;&nbsp;tracking devices were fitted to the matriarchs</p>\n<p>\u2013 &nbsp;&nbsp;data including the size of their tusks and <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-37\" class=\"ielts-listening-question-number\">37</strong>  [___] </span>&nbsp;was taken</p>\n<ul>\n<li>elephants were taken by truck to their new reserve</li>\n</ul>\n<p><strong>Advantages of translocation at Nkhotakota Wildlife Park</strong></p>\n<ul>\n<li><span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-38\" class=\"ielts-listening-question-number\">38</strong>  [___] </span>&nbsp;opportunities</li>\n<li>a reduction in the number of poachers and <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-39\" class=\"ielts-listening-question-number\">39</strong>  [___] </span></li>\n<li>an example of conservation that other parks can follow</li>\n<li>an increase in <span class=\"ielts-listening-question-item\"><strong id=\"ielts-listening-question-number-40\" class=\"ielts-listening-question-number\">40</strong>  [___] </span>&nbsp;as a contributor to GDP</li>\n</ul>\n</div>\n                                        </div>\n                                        <div class=\"ielts-listening-questions\">\n                                                                                                                                            <div class=\"ielts-listening-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-listening-question-item\">                                    \n                                                                                       \n                                                                                                    \n                 "passage": "\n                        <div class=\"test-content\">    \n                            <div id=\"ielts-reading-transcript-1\" class=\"ielts-reading-transcript current\"><h2><strong>Urban farming</strong></h2>\n<p><em>In Paris, urban farmers are trying a soil-free approach to agriculture that uses less space and fewer resources. Could it help cities face the threats to our food supplies?</em></p>\n<p>On top of a striking new exhibition hall in southern Paris, the world\u2019s largest urban rooftop farm has started to bear fruit. Strawberries that are small, intensely flavoured and resplendently red sprout abundantly from large plastic tubes. Peer inside and you see the tubes are completely hollow, the roots of dozens of strawberry plants dangling down inside them. From identical vertical tubes nearby burst row upon row of lettuces; near those are aromatic herbs, such as basil, sage and peppermint. Opposite, in narrow, horizontal trays packed not with soil but with coconut fibre, grow cherry tomatoes, shiny aubergines and brightly coloured chards.</p>\n<p>Pascal Hardy, an engineer and sustainable development consultant, began experimenting with vertical farming and aeroponic growing towers- as the soil-free plastic tubes are known \u2013 on his Paris apartment block roof five years ago. The urban rooftop space above the exhibition hall is somewhat bigger: 14,000 square metres and almost exactly the size of a couple of football pitches. Already, the team of young urban farmers who tend it have picked, in one day, 3,000 lettuces and 150 punnets of strawberries. When the remaining two thirds of the vast open area are in production, 20 staff will harvest up to 1,000 kg of perhaps 35 different varieties of fruit and vegetables, every day. \u2018We\u2019re not ever, obviously, going to feed the whole city this way,\u2019 cautions Hardy. \u2018In the urban environment you\u2019re working with very significant practical constraints, clearly, on what you can do and where. But if enough unused space can be developed like this, there\u2019s no reason why you shouldn\u2019t eventually target maybe between 5% and 10% of consumption.\u2019</p>\n<p>Perhaps most significantly, however, this is a real-life showcase for the work of Hardy\u2019s flourishing urban agriculture consultancy, Agripolis, which is currently fielding enquiries from around the world to design, build and equip a new breed of soil-free inner-city farm. \u2018The method\u2019s advantages are many,\u2019 he says. \u2018First, I don\u2019t much like the fact that most of the fruit and vegetables we eat have been treated with something like 17 different pesticides, or that the intensive farming techniques that produced them are such huge generators of greenhouse gases. I don\u2019t much like the fact, either, that they\u2019ve travelled an average of 2,000 refrigerated kilometres to my plate, that their quality is so poor, because the varieties are selected for their capacity to withstand such substantial journeys, or that 80% of the price I pay goes to wholesalers and transport companies, not the producers.\u2019</p>\n<p>Produce grown using this soil-free method, on the other hand- which relies solely on a small quantity of water, enriched with organic nutrients, pumped around a closed circuit of pipes, towers and trays- is \u2018produced up here, and sold locally, just down there. It barely travels at all,\u2019 Hardy says. \u2018You can select crop varieties for their flavour, not their resistance to the transport and storage chain, and you can pick them when they\u2019re really at their best, and not before.\u2019 No soil is exhausted, and the water that gently showers the plants\u2019 roots every 12 minutes is recycled, so the method uses 90% less water than a classic intensive farm for the same yield.</p>\n<p>Urban farming is not, of course, a new phenomenon. Inner-city agriculture is booming from Shanghai to Detroit and Tokyo to Bangkok. Strawberries are being grown in disused shipping containers, mushrooms in underground carparks. Aeroponic farming, he says, is \u2018virtuous\u2019. The equipment weighs little, can be installed on almost any flat surface and is cheap to buy: roughly \u20ac100 to \u20ac150 per square metre. It is cheap to run, too, consuming a tiny fraction of the electricity used by some techniques.</p>\n<p>Produce grown this way typically sells at prices that, while generally higher than those of classic intensive agriculture, are lower than soil-based organic growers. There are limits to what farmers can grow this way, of course, and much of the produce is suited to the summer months. \u2018Root vegetables we cannot do, at least not yet,\u2019 he says. \u2018Radishes are OK, but carrots, potatoes, that kind of thing- the roots are simply too long. Fruit trees are obviously not an option. And beans tend to take up a lot of space for not much return.\u2019 Nevertheless, urban farming of the kind being practised in Paris is one part of a bigger and fast-changing picture that is bringing food production closer to our lives.</p>\n</div><div id=\"ielts-reading-transcript-2\" class=\"ielts-reading-transcript \"><h2><strong>Forest management in Pennsylvania, USA</strong></h2>\n<p><em>How managing low-quality wood (also known as low-use wood) for bioenergy can encourage sustainable forest management</em></p>\n<p><strong>A</strong></p>\n<p>A tree\u2019s \u2018value\u2019 depends on several factors including its species, size, form, condition, quality, function, and accessibility, and depends on the management goals for a given forest. The same tree can be valued very differently by each person who looks at it. A large, straight black cherry tree has high value as timber to be cut into logs or made into furniture, but for a landowner more interested in wildlife habitat, the real value of that stem (or trunk) may be the food it provides to animals. Likewise, if the tree suffers from black knot disease, its value for timber decreases, but to a woodworker interested in making bowls, it brings an opportunity for a unique and beautiful piece of art.</p>\n<p><strong>B</strong></p>\n<p>In the past, Pennsylvania landowners were solely interested in the value of their trees as high-quality timber. The norm was to remove the stems of highest quality and leave behind poorly formed trees that were not as well suited to the site where they grew. This practice, called \u2018high-grading\u2019, has left a legacy of \u2018low-use wood\u2019 in the forests. Some people even call these \u2018junk trees\u2019, and they are abundant in Pennsylvania. These trees have lower economic value for traditional timber markets, compete for growth with higher-value trees, shade out desirable regeneration and decrease the health of a stand leaving it more vulnerable to poor weather and disease. Management that specifically targets low-use wood can help landowners manage these forest health issues, and wood energy markets help promote this.</p>\n<p><strong>C</strong></p>\n<p>Wood energy markets can accept less expensive wood material of lower quality than would be suitable for traditional timber markets. Most wood used for energy in Pennsylvania is used to produce heat or electricity through combustion. Many schools and hospitals use wood boiler systems to heat and power their facilities, many homes are primarily heated with wood, and some coal plants incorporate wood into their coal streams to produce electricity. Wood can also be gasified for electrical generation and can even be made into liquid fuels like ethanol and gasoline for lorries and cars. All these products are made primarily from low-use wood. Several tree- and plant-cutting approaches, which could greatly improve the long-term quality of a forest, focus strongly or solely on the use of wood for those markets.</p>\n<p><strong>D</strong></p>\n<p>One such approach is called a Timber Stand Improvement (TSI) Cut. In a TSI Cut, really poor-quality tree and plant material is cut down to allow more space, light, and other resources to the highest-valued stems that remain. Removing invasive plants might be another primary goal of a TSI Cut. The stems that are left behind might then grow in size and develop more foliage and larger crowns or tops that produce more coverage for wildlife; they have a better chance to regenerate in a less crowded environment. TSI Cuts can be tailored to one farmer\u2019s specific management goals for his or her land.</p>\n<p><strong>E</strong></p>\n<p>Another approach that might yield a high amount of low-use wood is a Salvage Cut. With the many pests and pathogens visiting forests including hemlock wooly adelgid, Asian longhomed beetle, emerald ash borer, and gypsy moth, to name just a few, it is important to remember that those working in the forests can help ease these issues through cutting procedures. These types of cut reduce the number of sick trees and seek to manage the future spread of a pest problem. They leave vigorous trees that have stayed healthy enough to survive the outbreak.</p>\n<p><strong>F</strong></p>\n<p>A Shelterwood Cut, which only takes place in a mature forest that has already been thinned several times, involves removing all the mature trees when other seedlings have become established. This then allows the forester to decide which tree species are regenerated. It leaves a young forest where all trees are at a similar point in their growth. It can also be used to develop a two-tier forest so that there are two harvests and the money that comes in is spread out over a decade or more.</p>\n<p><strong>G</strong></p>\n<p>Thinnings and dense and dead wood removal for fire prevention also center on the production of low-use wood. However, it is important to remember that some retention of what many would classify as low-use wood is very important. The tops of trees that have been cut down should be left on the site so that their nutrients cycle back into the soil. In addition, trees with many cavities are extremely important habitats for insect predators like woodpeckers, bats and small mammals. They help control problem insects and increase the health and resilience of the forest. It is also important to remember that not all small trees are low-use. For example, many species like hawthorn provide food for wildlife. Finally, rare species of trees in a forest should also stay behind as they add to its structural diversity.</p>\n<p>\u2014\u2014\u2014\u2014\u2014</p>\n<p>*Stand \u2013 An area covered with trees that have common features (e.g. size)</p>\n</div><div id=\"ielts-reading-transcript-3\" class=\"ielts-reading-transcript \"><h2><strong>Conquering Earth\u2019s space junk problem</strong></h2>\n<p><em>Satellites, rocket shards and collision debris are creating major traffic risks in orbit around the planet. Researchers are working to reduce these threats</em></p>\n<p><strong>A</strong></p>\n<p>Last year, commercial companies, military and civil departments and amateurs sent more than 400 satellites into orbit, over four times the yearly average in the previous decade. Numbers could rise even more sharply if leading space companies follow through on plans to deploy hundreds to thousands of large constellations of satellites to space in the next few years.</p>\n<p>All that traffic can lead to disaster. Ten years ago, a US commercial Iridium satellite smashed into an inactive Russian communications satellite called Cosmos-2251, creating thousands of new pieces of space shrapnel that now threaten other satellites in low Earth orbit \u2013 the zone stretching up to 2,000 kilometres in altitude. Altogether, there are roughly 20,000 human-made objects in orbit, from working satellites to small rocket pieces. And satellite operators can\u2019t steer away from every potential crash, because each move consumes time and fuel that could otherwise be used for the spacecraft\u2019s main job.</p>\n<p><strong>B</strong></p>\n<p>Concern about space junk goes back to the beginning of the satellite era, but the number of objects in orbit is rising so rapidly that researchers are investigating new ways of attacking the problem. Several teams are trying to improve methods for assessing what is in orbit, so that satellite operators can work more efficiently in ever-more-crowded space. Some researchers are now starting to compile a massive data set that includes the best possible information on where everything is in orbit. Others are developing taxonomies of space \u2013 working on measuring properties such as the shape and size of an object, so that satellite operators know how much to worry about what\u2019s coming their way.</p>\n<p>The alternative, many say, is unthinkable. Just a few uncontrolled space crashes could generate enough debris to set off a runaway cascade of fragments, rendering near-Earth space unusable. \u2018If we go on like this, we will reach a point of no return,\u2019 says Carolin Frueh, an astrodynamical researcher at Purdue University in West Lafayette, Indiana.</p>\n<p><strong>C</strong></p>\n<p>Even as our ability to monitor space objects increases, so too does the total number of items in orbit. That means companies, governments and other players in space are collaborating in new ways to avoid a shared threat. International groups such as the Inter-Agency Space Debris Coordination Committee have developed guidelines on space sustainability. Those include inactivating satellites at the end of their useful life by venting pressurised materials or leftover fuel that might lead to explosions. The intergovernmental groups also advise lowering satellites deep enough into the atmosphere that they will burn up or disintegrate within 25 years. But so far, only about half of all missions have abided by this 25-year goal, says Holger Krag, head of the European Space Agency\u2019s space-debris office in Darmstadt, Germany. Operators of the planned large constellations of satellites say they will be responsible stewards in their enterprises in space, but Krag worries that problems could increase, despite their best intentions. \u2018What happens to those that fail or go bankrupt?\u2019 he asks. They are probably not going to spend money to remove their satellites from space.\u2019</p>\n<p><strong>D</strong></p>\n<p>In theory, given the vastness of space, satellite operators should have plenty of room for all these missions to fly safely without ever nearing another object. So some scientists are tackling the problem of space junk by trying to find out where all the debris is to a high degree of precision. That would alleviate the need for many of the unnecessary manoeuvres that are carried out to avoid potential collisions. \u2018If you knew precisely where everything was, you would almost never have a problem,\u2019 says Marlon Sorge, a space-debris specialist at the Aerospace Corporation in El Segundo, California.</p>\n<p><strong>E</strong></p>\n<p>The field is called space traffic management, because it\u2019s similar to managing traffic on the roads or in the air. Think about a busy day at an airport, says Moriba Jah, an astrodynamicist at the University of Texas at Austin: planes line up in the sky, landing and taking off close to one another in a carefully choreographed routine. Air-traffic controllers know the location of the planes down to one metre in accuracy. The same can\u2019t be said for space debris. Not all objects in orbit are known, and even those included in databases are not tracked consistently.</p>\n<p><strong>F</strong></p>\n<p>An additional problem is that there is no authoritative catalogue that accurately lists the orbits of all known space debris. Jah illustrates this with a web-based database that he has developed. It draws on several sources, such as catalogues maintained by the US and Russian governments, to visualise where objects are in space. When he types in an identifier for a particular space object, the database draws a purple line to designate its orbit. Only this doesn\u2019t quite work for a number of objects, such as a Russian rocket body designated in the database as object number 32280. When Jah enters that number, the database draws two purple lines: the US and Russian sources contain two completely different orbits for the same object. Jah says that it is almost impossible to tell which is correct, unless a third source of information made it possible to cross-correlate.</p>\n<p>Jah describes himself as a space environmentalist: \u2018I want to make space a place that is safe to operate, that is free and useful for generations to come.\u2019 Until that happens, he argues, the space community will continue devolving into a tragedy in which all spaceflight operators are polluting a common resource.</p>\n</div>                        </div>\n                    ",
                "questions": "\n                                                    <form id=\"ielts-reading-test-form\" class=\"ielts-reading-test-form\">\n                                <input type=\"hidden\" id=\"ielts_reading_test_nonce\" name=\"ielts_reading_test_nonce\" value=\"6b395a871d\"><input type=\"hidden\" name=\"_wp_http_referer\" value=\"/ielts-reading-tests/cambridge-ielts-18-academic-reading-test-1/\">                                <input type=\"hidden\" id=\"post_id\" name=\"post_id\" value=\"10609\">\n                                <input type=\"hidden\" id=\"category_type\" name=\"category_type\" value=\"academic\">\n                                <div class=\"ielts-reading-question-sections\">\n                                                                                                                <div id=\"ielts-reading-question-section-1\" class=\"ielts-reading-question-section current\" data-part-number=\"1\">                                        <h2 class=\"ielts-reading-question-section-heading\"> Questions 1-3 </h2>\n                                        <div class=\"ielts-reading-question-section-content\">\n                                            <div class=\"ielts-reading-section-content-wrapper\"><em>Complete the sentences below.</em><p></p>\n<p><em>Choose&nbsp;<strong>NO MORE THAN TWO WORDS ANDIOR A NUMBER</strong>&nbsp;from the passage for each answer.</em></p>\n<p><em>Write your answers in boxes on your answer sheet.</em></p>\n<h3><strong>Urban farming in Paris</strong></h3>\n<ul>\n<li>Vertical tubes are used to grow strawberries, <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-1\" class=\"ielts-reading-question-number\">1</strong>  [___] </span> and herbs.</li>\n<li>There will eventually be a daily harvest of as much as <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-2\" class=\"ielts-reading-question-number\">2</strong>  [___] </span>                 "passage": "\n                        <div class=\"test-content\">    \n                            <div id=\"ielts-reading-transcript-1\" class=\"ielts-reading-transcript\"><h2><strong>Urban farming</strong></h2>\n<p><em>In Paris, urban farmers are trying a soil-free approach to agriculture that uses less space and fewer resources. Could it help cities face the threats to our food supplies?</em></p>\n<p>On top of a striking new exhibition hall in southern Paris, the world\u2019s largest urban rooftop farm has started to bear fruit. Strawberries that are small, intensely flavoured and resplendently red sprout abundantly from large plastic tubes. Peer inside and you see the tubes are completely hollow, the roots of dozens of strawberry plants dangling down inside them. From identical vertical tubes nearby burst row upon row of lettuces; near those are aromatic herbs, such as basil, sage and peppermint. Opposite, in narrow, horizontal trays packed not with soil but with coconut fibre, grow cherry tomatoes, shiny aubergines and brightly coloured chards.</p>\n<p>Pascal Hardy, an engineer and sustainable development consultant, began experimenting with vertical farming and aeroponic growing towers- as the soil-free plastic tubes are known \u2013 on his Paris apartment block roof five years ago. The urban rooftop space above the exhibition hall is somewhat bigger: 14,000 square metres and almost exactly the size of a couple of football pitches. Already, the team of young urban farmers who tend it have picked, in one day, 3,000 lettuces and 150 punnets of strawberries. When the remaining two thirds of the vast open area are in production, 20 staff will harvest up to 1,000 kg of perhaps 35 different varieties of fruit and vegetables, every day. \u2018We\u2019re not ever, obviously, going to feed the whole city this way,\u2019 cautions Hardy. \u2018In the urban environment you\u2019re working with very significant practical constraints, clearly, on what you can do and where. But if enough unused space can be developed like this, there\u2019s no reason why you shouldn\u2019t eventually target maybe between 5% and 10% of consumption.\u2019</p>\n<p>Perhaps most significantly, however, this is a real-life showcase for the work of Hardy\u2019s flourishing urban agriculture consultancy, Agripolis, which is currently fielding enquiries from around the world to design, build and equip a new breed of soil-free inner-city farm. \u2018The method\u2019s advantages are many,\u2019 he says. \u2018First, I don\u2019t much like the fact that most of the fruit and vegetables we eat have been treated with something like 17 different pesticides, or that the intensive farming techniques that produced them are such huge generators of greenhouse gases. I don\u2019t much like the fact, either, that they\u2019ve travelled an average of 2,000 refrigerated kilometres to my plate, that their quality is so poor, because the varieties are selected for their capacity to withstand such substantial journeys, or that 80% of the price I pay goes to wholesalers and transport companies, not the producers.\u2019</p>\n<p>Produce grown using this soil-free method, on the other hand- which relies solely on a small quantity of water, enriched with organic nutrients, pumped around a closed circuit of pipes, towers and trays- is \u2018produced up here, and sold locally, just down there. It barely travels at all,\u2019 Hardy says. \u2018You can select crop varieties for their flavour, not their resistance to the transport and storage chain, and you can pick them when they\u2019re really at their best, and not before.\u2019 No soil is exhausted, and the water that gently showers the plants\u2019 roots every 12 minutes is recycled, so the method uses 90% less water than a classic intensive farm for the same yield.</p>\n<p>Urban farming is not, of course, a new phenomenon. Inner-city agriculture is booming from Shanghai to Detroit and Tokyo to Bangkok. Strawberries are being grown in disused shipping containers, mushrooms in underground carparks. Aeroponic farming, he says, is \u2018virtuous\u2019. The equipment weighs little, can be installed on almost any flat surface and is cheap to buy: roughly \u20ac100 to \u20ac150 per square metre. It is cheap to run, too, consuming a tiny fraction of the electricity used by some techniques.</p>\n<p>Produce grown this way typically sells at prices that, while generally higher than those of classic intensive agriculture, are lower than soil-based organic growers. There are limits to what farmers can grow this way, of course, and much of the produce is suited to the summer months. \u2018Root vegetables we cannot do, at least not yet,\u2019 he says. \u2018Radishes are OK, but carrots, potatoes, that kind of thing- the roots are simply too long. Fruit trees are obviously not an option. And beans tend to take up a lot of space for not much return.\u2019 Nevertheless, urban farming of the kind being practised in Paris is one part of a bigger and fast-changing picture that is bringing food production closer to our lives.</p>\n</div><div id=\"ielts-reading-transcript-2\" class=\"ielts-reading-transcript current\"><h2><strong>Forest management in Pennsylvania, USA</strong></h2>\n<p><em>How managing low-quality wood (also known as low-use wood) for bioenergy can encourage sustainable forest management</em></p>\n<p><strong>A</strong></p>\n<p>A tree\u2019s \u2018value\u2019 depends on several factors including its species, size, form, condition, quality, function, and accessibility, and depends on the management goals for a given forest. The same tree can be valued very differently by each person who looks at it. A large, straight black cherry tree has high value as timber to be cut into logs or made into furniture, but for a landowner more interested in wildlife habitat, the real value of that stem (or trunk) may be the food it provides to animals. Likewise, if the tree suffers from black knot disease, its value for timber decreases, but to a woodworker interested in making bowls, it brings an opportunity for a unique and beautiful piece of art.</p>\n<p><strong>B</strong></p>\n<p>In the past, Pennsylvania landowners were solely interested in the value of their trees as high-quality timber. The norm was to remove the stems of highest quality and leave behind poorly formed trees that were not as well suited to the site where they grew. This practice, called \u2018high-grading\u2019, has left a legacy of \u2018low-use wood\u2019 in the forests. Some people even call these \u2018junk trees\u2019, and they are abundant in Pennsylvania. These trees have lower economic value for traditional timber markets, compete for growth with higher-value trees, shade out desirable regeneration and decrease the health of a stand leaving it more vulnerable to poor weather and disease. Management that specifically targets low-use wood can help landowners manage these forest health issues, and wood energy markets help promote this.</p>\n<p><strong>C</strong></p>\n<p>Wood energy markets can accept less expensive wood material of lower quality than would be suitable for traditional timber markets. Most wood used for energy in Pennsylvania is used to produce heat or electricity through combustion. Many schools and hospitals use wood boiler systems to heat and power their facilities, many homes are primarily heated with wood, and some coal plants incorporate wood into their coal streams to produce electricity. Wood can also be gasified for electrical generation and can even be made into liquid fuels like ethanol and gasoline for lorries and cars. All these products are made primarily from low-use wood. Several tree- and plant-cutting approaches, which could greatly improve the long-term quality of a forest, focus strongly or solely on the use of wood for those markets.</p>\n<p><strong>D</strong></p>\n<p>One such approach is called a Timber Stand Improvement (TSI) Cut. In a TSI Cut, really poor-quality tree and plant material is cut down to allow more space, light, and other resources to the highest-valued stems that remain. Removing invasive plants might be another primary goal of a TSI Cut. The stems that are left behind might then grow in size and develop more foliage and larger crowns or tops that produce more coverage for wildlife; they have a better chance to regenerate in a less crowded environment. TSI Cuts can be tailored to one farmer\u2019s specific management goals for his or her land.</p>\n<p><strong>E</strong></p>\n<p>Another approach that might yield a high amount of low-use wood is a Salvage Cut. With the many pests and pathogens visiting forests including hemlock wooly adelgid, Asian longhomed beetle, emerald ash borer, and gypsy moth, to name just a few, it is important to remember that those working in the forests can help ease these issues through cutting procedures. These types of cut reduce the number of sick trees and seek to manage the future spread of a pest problem. They leave vigorous trees that have stayed healthy enough to survive the outbreak.</p>\n<p><strong>F</strong></p>\n<p>A Shelterwood Cut, which only takes place in a mature forest that has already been thinned several times, involves removing all the mature trees when other seedlings have become established. This then allows the forester to decide which tree species are regenerated. It leaves a young forest where all trees are at a similar point in their growth. It can also be used to develop a two-tier forest so that there are two harvests and the money that comes in is spread out over a decade or more.</p>\n<p><strong>G</strong></p>\n<p>Thinnings and dense and dead wood removal for fire prevention also center on the production of low-use wood. However, it is important to remember that some retention of what many would classify as low-use wood is very important. The tops of trees that have been cut down should be left on the site so that their nutrients cycle back into the soil. In addition, trees with many cavities are extremely important habitats for insect predators like woodpeckers, bats and small mammals. They help control problem insects and increase the health and resilience of the forest. It is also important to remember that not all small trees are low-use. For example, many species like hawthorn provide food for wildlife. Finally, rare species of trees in a forest should also stay behind as they add to its structural diversity.</p>\n<p>\u2014\u2014\u2014\u2014\u2014</p>\n<p>*Stand \u2013 An area covered with trees that have common features (e.g. size)</p>\n</div><div id=\"ielts-reading-transcript-3\" class=\"ielts-reading-transcript\"><h2><strong>Conquering Earth\u2019s space junk problem</strong></h2>\n<p><em>Satellites, rocket shards and collision debris are creating major traffic risks in orbit around the planet. Researchers are working to reduce these threats</em></p>\n<p><strong>A</strong></p>\n<p>Last year, commercial companies, military and civil departments and amateurs sent more than 400 satellites into orbit, over four times the yearly average in the previous decade. Numbers could rise even more sharply if leading space companies follow through on plans to deploy hundreds to thousands of large constellations of satellites to space in the next few years.</p>\n<p>All that traffic can lead to disaster. Ten years ago, a US commercial Iridium satellite smashed into an inactive Russian communications satellite called Cosmos-2251, creating thousands of new pieces of space shrapnel that now threaten other satellites in low Earth orbit \u2013 the zone stretching up to 2,000 kilometres in altitude. Altogether, there are roughly 20,000 human-made objects in orbit, from working satellites to small rocket pieces. And satellite operators can\u2019t steer away from every potential crash, because each move consumes time and fuel that could otherwise be used for the spacecraft\u2019s main job.</p>\n<p><strong>B</strong></p>\n<p>Concern about space junk goes back to the beginning of the satellite era, but the number of objects in orbit is rising so rapidly that researchers are investigating new ways of attacking the problem. Several teams are trying to improve methods for assessing what is in orbit, so that satellite operators can work more efficiently in ever-more-crowded space. Some researchers are now starting to compile a massive data set that includes the best possible information on where everything is in orbit. Others are developing taxonomies of space \u2013 working on measuring properties such as the shape and size of an object, so that satellite operators know how much to worry about what\u2019s coming their way.</p>\n<p>The alternative, many say, is unthinkable. Just a few uncontrolled space crashes could generate enough debris to set off a runaway cascade of fragments, rendering near-Earth space unusable. \u2018If we go on like this, we will reach a point of no return,\u2019 says Carolin Frueh, an astrodynamical researcher at Purdue University in West Lafayette, Indiana.</p>\n<p><strong>C</strong></p>\n<p>Even as our ability to monitor space objects increases, so too does the total number of items in orbit. That means companies, governments and other players in space are collaborating in new ways to avoid a shared threat. International groups such as the Inter-Agency Space Debris Coordination Committee have developed guidelines on space sustainability. Those include inactivating satellites at the end of their useful life by venting pressurised materials or leftover fuel that might lead to explosions. The intergovernmental groups also advise lowering satellites deep enough into the atmosphere that they will burn up or disintegrate within 25 years. But so far, only about half of all missions have abided by this 25-year goal, says Holger Krag, head of the European Space Agency\u2019s space-debris office in Darmstadt, Germany. Operators of the planned large constellations of satellites say they will be responsible stewards in their enterprises in space, but Krag worries that problems could increase, despite their best intentions. \u2018What happens to those that fail or go bankrupt?\u2019 he asks. They are probably not going to spend money to remove their satellites from space.\u2019</p>\n<p><strong>D</strong></p>\n<p>In theory, given the vastness of space, satellite operators should have plenty of room for all these missions to fly safely without ever nearing another object. So some scientists are tackling the problem of space junk by trying to find out where all the debris is to a high degree of precision. That would alleviate the need for many of the unnecessary manoeuvres that are carried out to avoid potential collisions. \u2018If you knew precisely where everything was, you would almost never have a problem,\u2019 says Marlon Sorge, a space-debris specialist at the Aerospace Corporation in El Segundo, California.</p>\n<p><strong>E</strong></p>\n<p>The field is called space traffic management, because it\u2019s similar to managing traffic on the roads or in the air. Think about a busy day at an airport, says Moriba Jah, an astrodynamicist at the University of Texas at Austin: planes line up in the sky, landing and taking off close to one another in a carefully choreographed routine. Air-traffic controllers know the location of the planes down to one metre in accuracy. The same can\u2019t be said for space debris. Not all objects in orbit are known, and even those included in databases are not tracked consistently.</p>\n<p><strong>F</strong></p>\n<p>An additional problem is that there is no authoritative catalogue that accurately lists the orbits of all known space debris. Jah illustrates this with a web-based database that he has developed. It draws on several sources, such as catalogues maintained by the US and Russian governments, to visualise where objects are in space. When he types in an identifier for a particular space object, the database draws a purple line to designate its orbit. Only this doesn\u2019t quite work for a number of objects, such as a Russian rocket body designated in the database as object number 32280. When Jah enters that number, the database draws two purple lines: the US and Russian sources contain two completely different orbits for the same object. Jah says that it is almost impossible to tell which is correct, unless a third source of information made it possible to cross-correlate.</p>\n<p>Jah describes himself as a space environmentalist: \u2018I want to make space a place that is safe to operate, that is free and useful for generations to come.\u2019 Until that happens, he argues, the space community will continue devolving into a tragedy in which all spaceflight operators are polluting a common resource.</p>\n</div>                        </div>\n                    ",

swer.</em></p>\n<p><em>Write your answers in boxes on your answer sheet.</em></p>\n<h3><strong>The Inter-Agency Space Debris Coordination Committee</strong></h3>\n<p>The committee gives advice on how the <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-32\" class=\"ielts-reading-question-number\">32</strong>  [___] </span> of space can be achieved. The committee advises that when satellites are no longer active, any unused <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-33\" class=\"ielts-reading-question-number\">33</strong>  [___] </span> or pressurised material that could cause <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-34\" class=\"ielts-reading-question-number\">34</strong>  [___] </span>&nbsp;should be removed.</p>\n<p>Although operators of large satellite constellations accept that they have obligations as stewards of space, Holger Krag points out that the operators that become <span class=\"ielts-reading-question-item\"><strong id=\"ielts-reading-question-number-35\" class=\"ielts-reading-question-number\">35</strong>  [___] </span>&nbsp;are unlikely to prioritise removing their satellites from space.</p></div>\n                                        </div>\n                                        <div class=\"ielts-reading-questions\">\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                                                       \n                                                                                                    \n                                                                                                       \n           \n                                                                                       \n                                                                                                    \n                                                                                                       \n                                                                                                 \n                                                                                                                               \n                                                </div>\n                                                                                    </div>\n                                                                                                                                                            <h2 class=\"ielts-reading-question-section-heading\"> Questions 36-40 </h2>\n                                        <div class=\"ielts-reading-question-section-content\">\n                                            <p><em>Look at the following statements and the list of people below.</em></p>\n<p><em>Match each statement with the correct person,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>,&nbsp;<strong>C</strong>&nbsp;or&nbsp;<strong>D</strong>.</em></p>\n<p><em>Write the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>,&nbsp;<strong>C</strong>&nbsp;or&nbsp;<strong>D</strong>, in boxes on your answer sheet.</em></p>\n<p><strong><em>NB</em></strong><em>&nbsp;&nbsp;&nbsp;You may use any letter more than once.</em></p>\n<p><strong>List of People</strong></p>\n<p><strong>A&nbsp;</strong>&nbsp;&nbsp;&nbsp;&nbsp;Carolin Frueh</p>\n<p><strong>B&nbsp; &nbsp;</strong>&nbsp;&nbsp;Holger Krag</p>\n<p><strong>C &nbsp;&nbsp;</strong>&nbsp;&nbsp;Marlon Sorge</p>\n<p><strong>D&nbsp; &nbsp;</strong>&nbsp;&nbsp;Moriba Jah</p>\n                                        </div>\n                                        <div class=\"ielts-reading-questions\">\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-36\" class=\"ielts-reading-question-number\">36</strong> <span>Knowing the exact location of space junk would help prevent any possible danger.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-37\" class=\"ielts-reading-question-number\">37</strong> <span>Space should be available to everyone and should be preserved for the future.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                 "passage": "\n                        <div class=\"test-content\">    \n                            <div id=\"ielts-reading-transcript-1\" class=\"ielts-reading-transcript\"><h2><strong>Urban farming</strong></h2>\n<p><em>In Paris, urban farmers are trying a soil-free approach to agriculture that uses less space and fewer resources. Could it help cities face the threats to our food supplies?</em></p>\n<p>On top of a striking new exhibition hall in southern Paris, the world\u2019s largest urban rooftop farm has started to bear fruit. Strawberries that are small, intensely flavoured and resplendently red sprout abundantly from large plastic tubes. Peer inside and you see the tubes are completely hollow, the roots of dozens of strawberry plants dangling down inside them. From identical vertical tubes nearby burst row upon row of lettuces; near those are aromatic herbs, such as basil, sage and peppermint. Opposite, in narrow, horizontal trays packed not with soil but with coconut fibre, grow cherry tomatoes, shiny aubergines and brightly coloured chards.</p>\n<p>Pascal Hardy, an engineer and sustainable development consultant, began experimenting with vertical farming and aeroponic growing towers- as the soil-free plastic tubes are known \u2013 on his Paris apartment block roof five years ago. The urban rooftop space above the exhibition hall is somewhat bigger: 14,000 square metres and almost exactly the size of a couple of football pitches. Already, the team of young urban farmers who tend it have picked, in one day, 3,000 lettuces and 150 punnets of strawberries. When the remaining two thirds of the vast open area are in production, 20 staff will harvest up to 1,000 kg of perhaps 35 different varieties of fruit and vegetables, every day. \u2018We\u2019re not ever, obviously, going to feed the whole city this way,\u2019 cautions Hardy. \u2018In the urban environment you\u2019re working with very significant practical constraints, clearly, on what you can do and where. But if enough unused space can be developed like this, there\u2019s no reason why you shouldn\u2019t eventually target maybe between 5% and 10% of consumption.\u2019</p>\n<p>Perhaps most significantly, however, this is a real-life showcase for the work of Hardy\u2019s flourishing urban agriculture consultancy, Agripolis, which is currently fielding enquiries from around the world to design, build and equip a new breed of soil-free inner-city farm. \u2018The method\u2019s advantages are many,\u2019 he says. \u2018First, I don\u2019t much like the fact that most of the fruit and vegetables we eat have been treated with something like 17 different pesticides, or that the intensive farming techniques that produced them are such huge generators of greenhouse gases. I don\u2019t much like the fact, either, that they\u2019ve travelled an average of 2,000 refrigerated kilometres to my plate, that their quality is so poor, because the varieties are selected for their capacity to withstand such substantial journeys, or that 80% of the price I pay goes to wholesalers and transport companies, not the producers.\u2019</p>\n<p>Produce grown using this soil-free method, on the other hand- which relies solely on a small quantity of water, enriched with organic nutrients, pumped around a closed circuit of pipes, towers and trays- is \u2018produced up here, and sold locally, just down there. It barely travels at all,\u2019 Hardy says. \u2018You can select crop varieties for their flavour, not their resistance to the transport and storage chain, and you can pick them when they\u2019re really at their best, and not before.\u2019 No soil is exhausted, and the water that gently showers the plants\u2019 roots every 12 minutes is recycled, so the method uses 90% less water than a classic intensive farm for the same yield.</p>\n<p>Urban farming is not, of course, a new phenomenon. Inner-city agriculture is booming from Shanghai to Detroit and Tokyo to Bangkok. Strawberries are being grown in disused shipping containers, mushrooms in underground carparks. Aeroponic farming, he says, is \u2018virtuous\u2019. The equipment weighs little, can be installed on almost any flat surface and is cheap to buy: roughly \u20ac100 to \u20ac150 per square metre. It is cheap to run, too, consuming a tiny fraction of the electricity used by some techniques.</p>\n<p>Produce grown this way typically sells at prices that, while generally higher than those of classic intensive agriculture, are lower than soil-based organic growers. There are limits to what farmers can grow this way, of course, and much of the produce is suited to the summer months. \u2018Root vegetables we cannot do, at least not yet,\u2019 he says. \u2018Radishes are OK, but carrots, potatoes, that kind of thing- the roots are simply too long. Fruit trees are obviously not an option. And beans tend to take up a lot of space for not much return.\u2019 Nevertheless, urban farming of the kind being practised in Paris is one part of a bigger and fast-changing picture that is bringing food production closer to our lives.</p>\n</div><div id=\"ielts-reading-transcript-2\" class=\"ielts-reading-transcript\"><h2><strong>Forest management in Pennsylvania, USA</strong></h2>\n<p><em>How managing low-quality wood (also known as low-use wood) for bioenergy can encourage sustainable forest management</em></p>\n<p><strong>A</strong></p>\n<p>A tree\u2019s \u2018value\u2019 depends on several factors including its species, size, form, condition, quality, function, and accessibility, and depends on the management goals for a given forest. The same tree can be valued very differently by each person who looks at it. A large, straight black cherry tree has high value as timber to be cut into logs or made into furniture, but for a landowner more interested in wildlife habitat, the real value of that stem (or trunk) may be the food it provides to animals. Likewise, if the tree suffers from black knot disease, its value for timber decreases, but to a woodworker interested in making bowls, it brings an opportunity for a unique and beautiful piece of art.</p>\n<p><strong>B</strong></p>\n<p>In the past, Pennsylvania landowners were solely interested in the value of their trees as high-quality timber. The norm was to remove the stems of highest quality and leave behind poorly formed trees that were not as well suited to the site where they grew. This practice, called \u2018high-grading\u2019, has left a legacy of \u2018low-use wood\u2019 in the forests. Some people even call these \u2018junk trees\u2019, and they are abundant in Pennsylvania. These trees have lower economic value for traditional timber markets, compete for growth with higher-value trees, shade out desirable regeneration and decrease the health of a stand leaving it more vulnerable to poor weather and disease. Management that specifically targets low-use wood can help landowners manage these forest health issues, and wood energy markets help promote this.</p>\n<p><strong>C</strong></p>\n<p>Wood energy markets can accept less expensive wood material of lower quality than would be suitable for traditional timber markets. Most wood used for energy in Pennsylvania is used to produce heat or electricity through combustion. Many schools and hospitals use wood boiler systems to heat and power their facilities, many homes are primarily heated with wood, and some coal plants incorporate wood into their coal streams to produce electricity. Wood can also be gasified for electrical generation and can even be made into liquid fuels like ethanol and gasoline for lorries and cars. All these products are made primarily from low-use wood. Several tree- and plant-cutting approaches, which could greatly improve the long-term quality of a forest, focus strongly or solely on the use of wood for those markets.</p>\n<p><strong>D</strong></p>\n<p>One such approach is called a Timber Stand Improvement (TSI) Cut. In a TSI Cut, really poor-quality tree and plant material is cut down to allow more space, light, and other resources to the highest-valued stems that remain. Removing invasive plants might be another primary goal of a TSI Cut. The stems that are left behind might then grow in size and develop more foliage and larger crowns or tops that produce more coverage for wildlife; they have a better chance to regenerate in a less crowded environment. TSI Cuts can be tailored to one farmer\u2019s specific management goals for his or her land.</p>\n<p><strong>E</strong></p>\n<p>Another approach that might yield a high amount of low-use wood is a Salvage Cut. With the many pests and pathogens visiting forests including hemlock wooly adelgid, Asian longhomed beetle, emerald ash borer, and gypsy moth, to name just a few, it is important to remember that those working in the forests can help ease these issues through cutting procedures. These types of cut reduce the number of sick trees and seek to manage the future spread of a pest problem. They leave vigorous trees that have stayed healthy enough to survive the outbreak.</p>\n<p><strong>F</strong></p>\n<p>A Shelterwood Cut, which only takes place in a mature forest that has already been thinned several times, involves removing all the mature trees when other seedlings have become established. This then allows the forester to decide which tree species are regenerated. It leaves a young forest where all trees are at a similar point in their growth. It can also be used to develop a two-tier forest so that there are two harvests and the money that comes in is spread out over a decade or more.</p>\n<p><strong>G</strong></p>\n<p>Thinnings and dense and dead wood removal for fire prevention also center on the production of low-use wood. However, it is important to remember that some retention of what many would classify as low-use wood is very important. The tops of trees that have been cut down should be left on the site so that their nutrients cycle back into the soil. In addition, trees with many cavities are extremely important habitats for insect predators like woodpeckers, bats and small mammals. They help control problem insects and increase the health and resilience of the forest. It is also important to remember that not all small trees are low-use. For example, many species like hawthorn provide food for wildlife. Finally, rare species of trees in a forest should also stay behind as they add to its structural diversity.</p>\n<p>\u2014\u2014\u2014\u2014\u2014</p>\n<p>*Stand \u2013 An area covered with trees that have common features (e.g. size)</p>\n</div><div id=\"ielts-reading-transcript-3\" class=\"ielts-reading-transcript current\"><h2><strong>Conquering Earth\u2019s space junk problem</strong></h2>\n<p><em>Satellites, rocket shards and collision debris are creating major traffic risks in orbit around the planet. Researchers are working to reduce these threats</em></p>\n<p><strong>A</strong></p>\n<p>Last year, commercial companies, military and civil departments and amateurs sent more than 400 satellites into orbit, over four times the yearly average in the previous decade. Numbers could rise even more sharply if leading space companies follow through on plans to deploy hundreds to thousands of large constellations of satellites to space in the next few years.</p>\n<p>All that traffic can lead to disaster. Ten years ago, a US commercial Iridium satellite smashed into an inactive Russian communications satellite called Cosmos-2251, creating thousands of new pieces of space shrapnel that now threaten other satellites in low Earth orbit \u2013 the zone stretching up to 2,000 kilometres in altitude. Altogether, there are roughly 20,000 human-made objects in orbit, from working satellites to small rocket pieces. And satellite operators can\u2019t steer away from every potential crash, because each move consumes time and fuel that could otherwise be used for the spacecraft\u2019s main job.</p>\n<p><strong>B</strong></p>\n<p>Concern about space junk goes back to the beginning of the satellite era, but the number of objects in orbit is rising so rapidly that researchers are investigating new ways of attacking the problem. Several teams are trying to improve methods for assessing what is in orbit, so that satellite operators can work more efficiently in ever-more-crowded space. Some researchers are now starting to compile a massive data set that includes the best possible information on where everything is in orbit. Others are developing taxonomies of space \u2013 working on measuring properties such as the shape and size of an object, so that satellite operators know how much to worry about what\u2019s coming their way.</p>\n<p>The alternative, many say, is unthinkable. Just a few uncontrolled space crashes could generate enough debris to set off a runaway cascade of fragments, rendering near-Earth space unusable. \u2018If we go on like this, we will reach a point of no return,\u2019 says Carolin Frueh, an astrodynamical researcher at Purdue University in West Lafayette, Indiana.</p>\n<p><strong>C</strong></p>\n<p>Even as our ability to monitor space objects increases, so too does the total number of items in orbit. That means companies, governments and other players in space are collaborating in new ways to avoid a shared threat. International groups such as the Inter-Agency Space Debris Coordination Committee have developed guidelines on space sustainability. Those include inactivating satellites at the end of their useful life by venting pressurised materials or leftover fuel that might lead to explosions. The intergovernmental groups also advise lowering satellites deep enough into the atmosphere that they will burn up or disintegrate within 25 years. But so far, only about half of all missions have abided by this 25-year goal, says Holger Krag, head of the European Space Agency\u2019s space-debris office in Darmstadt, Germany. Operators of the planned large constellations of satellites say they will be responsible stewards in their enterprises in space, but Krag worries that problems could increase, despite their best intentions. \u2018What happens to those that fail or go bankrupt?\u2019 he asks. They are probably not going to spend money to remove their satellites from space.\u2019</p>\n<p><strong>D</strong></p>\n<p>In theory, given the vastness of space, satellite operators should have plenty of room for all these missions to fly safely without ever nearing another object. So some scientists are tackling the problem of space junk by trying to find out where all the debris is to a high degree of precision. That would alleviate the need for many of the unnecessary manoeuvres that are carried out to avoid potential collisions. \u2018If you knew precisely where everything was, you would almost never have a problem,\u2019 says Marlon Sorge, a space-debris specialist at the Aerospace Corporation in El Segundo, California.</p>\n<p><strong>E</strong></p>\n<p>The field is called space traffic management, because it\u2019s similar to managing traffic on the roads or in the air. Think about a busy day at an airport, says Moriba Jah, an astrodynamicist at the University of Texas at Austin: planes line up in the sky, landing and taking off close to one another in a carefully choreographed routine. Air-traffic controllers know the location of the planes down to one metre in accuracy. The same can\u2019t be said for space debris. Not all objects in orbit are known, and even those included in databases are not tracked consistently.</p>\n<p><strong>F</strong></p>\n<p>An additional problem is that there is no authoritative catalogue that accurately lists the orbits of all known space debris. Jah illustrates this with a web-based database that he has developed. It draws on several sources, such as catalogues maintained by the US and Russian governments, to visualise where objects are in space. When he types in an identifier for a particular space object, the database draws a purple line to designate its orbit. Only this doesn\u2019t quite work for a number of objects, such as a Russian rocket body designated in the database as object number 32280. When Jah enters that number, the database draws two purple lines: the US and Russian sources contain two completely different orbits for the same object. Jah says that it is almost impossible to tell which is correct, unless a third source of information made it possible to cross-correlate.</p>\n<p>Jah describes himself as a space environmentalist: \u2018I want to make space a place that is safe to operate, that is free and useful for generations to come.\u2019 Until that happens, he argues, the space community will continue devolving into a tragedy in which all spaceflight operators are polluting a common resource.</p>\n</div>                        </div>\n                    ",

                                                                                   \n                                                        <div class=\"ielts-reading-option\"><label class=\"ielts-reading-option-letter\" for=\"ielts_reading_answer_10594_4_2\">C</label><input type=\"radio\" name=\"ielts_reading_answer_10594_4\" id=\"ielts_reading_answer_10594_4_2\" value=\"NOT GIVEN\"><span>NOT GIVEN</span></div>                                         \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-12\" class=\"ielts-reading-question-number\">12</strong> <span>Most produce can be grown on an aeroponic urban farm at any time of the year.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                        <div class=\"ielts-reading-option\"><label class=\"ielts-reading-option-letter\" for=\"ielts_reading_answer_10594_5_0\">A</label><input type=\"radio\" name=\"ielts_reading_answer_10594_5\" id=\"ielts_reading_answer_10594_5_0\" value=\"TRUE\"><span>TRUE</span></div>                                         \n                                                                                                       \n                                                        <div class=\"ielts-reading-option\"><label class=\"ielts-reading-option-letter\" for=\"ielts_reading_answer_10594_5_1\">B</label><input type=\"radio\" name=\"ielts_reading_answer_10594_5\" id=\"ielts_reading_answer_10594_5_1\" value=\"FALSE\"><span>FALSE</span></div>                                         \n                                                                                                       \n                                                        <div class=\"ielts-reading-option\"><label class=\"ielts-reading-option-letter\" for=\"ielts_reading_answer_10594_5_2\">C</label><input type=\"radio\" name=\"ielts_reading_answer_10594_5\" id=\"ielts_reading_answer_10594_5_2\" value=\"NOT GIVEN\"><span>NOT GIVEN</span></div>                                         \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-13\" class=\"ielts-reading-question-number\">13</strong> <span>Beans take longer to grow on an urban farm than other vegetables.</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                        <div class=\"ielts-reading-option\"><label class=\"ielts-reading-option-letter\" for=\"ielts_reading_answer_10594_6_0\">A</label><input type=\"radio\" name=\"ielts_reading_answer_10594_6\" id=\"ielts_reading_answer_10594_6_0\" value=\"TRUE\"><span>TRUE</span></div>                                         \n                                                                                                       \n                                                        <div class=\"ielts-reading-option\"><label class=\"ielts-reading-option-letter\" for=\"ielts_reading_answer_10594_6_1\">B</label><input type=\"radio\" name=\"ielts_reading_answer_10594_6\" id=\"ielts_reading_answer_10594_6_1\" value=\"FALSE\"><span>FALSE</span></div>                                         \n                                                                                                       \n                                                        <div class=\"ielts-reading-option\"><label class=\"ielts-reading-option-letter\" for=\"ielts_reading_answer_10594_6_2\">C</label><input type=\"radio\" name=\"ielts_reading_answer_10594_6\" id=\"ielts_reading_answer_10594_6_2\" value=\"NOT GIVEN\"><span>NOT GIVEN</span></div>                                         \n                                                                                                                               \n                                                </div>\n                                                                                    </div>\n                                        </div>                                                                            <div id=\"ielts-reading-question-section-2\" class=\"ielts-reading-question-section\" data-part-number=\"2\">                                        <h2 class=\"ielts-reading-question-section-heading\"> Questions 14-18 </h2>\n                                        <div class=\"ielts-reading-question-section-content\">\n                                            <p>The Reading Passage has seven paragraphs, <strong>A-G</strong>.</p>\n<p>Which paragraph contains the following information?</p>\n<p><em>Write the correct letter,&nbsp;<strong>A-G</strong>, in boxes on your answer sheet.</em></p>\n<p><strong><em>NB</em></strong><em>&nbsp;&nbsp; You may use any letter more than once.</em></p>\n                                        </div>\n                                        <div class=\"ielts-reading-questions\">\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-14\" class=\"ielts-reading-question-number\">14</strong> <span>bad outcomes for a forest when people focus only on its financial reward</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-15\" class=\"ielts-reading-question-number\">15</strong> <span>reference to the aspects of any tree that contribute to its worth</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-16\" class=\"ielts-reading-question-number\">16</strong> <span>mention of the potential use of wood to help run vehicles</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-17\" class=\"ielts-reading-question-number\">17</strong> <span>examples of insects that attack trees</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n ce.</em></p>\n<p><strong>List of Timber Cuts</strong></p>\n<p><strong>A</strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a TSI Cut</p>\n<p><strong>B&nbsp;</strong>&nbsp;&nbsp;&nbsp;&nbsp;a Salvage Cut</p>\n<p><strong>C&nbsp;</strong>&nbsp;&nbsp;&nbsp;&nbsp;a Shelterwood Cut</p>\n                                        </div>\n                                        <div class=\"ielts-reading-questions\">\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-19\" class=\"ielts-reading-question-number\">19</strong> <span>to remove trees that are diseased</span></span>                                   \n                                                                                                    \n                                                                                                       \n                                                         [___]                                          \n                                                                                                                               \n                                                </div>\n                                                                                                                                            <div class=\"ielts-reading-question-item\">                                    \n                                                    <span><strong id=\"ielts-reading-question-number-20\" class=\"ielts-reading-question-number\">20</strong> <span>to generate income across a number of years</span></span>                                   \n                                                                                                    \n
