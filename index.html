<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IELTS Prep - Your Personal Exam Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #fb7185;
            --primary-dark: #e11d48;
            --bg: #ffffff;
            --card: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-light: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* SPLASH SCREEN & DASHBOARD */
        #dashboard {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .logo-area h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo-area h1 span {
            color: var(--primary);
        }

        .logo-area p {
            color: var(--text-light);
            font-size: 16px;
            margin-top: 5px;
        }

        .test-grid {
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            animation: fadeInUp 1s ease;
        }

        .test-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .test-card:active {
            transform: scale(0.97);
            background: #fff1f2;
            border-color: var(--primary);
        }

        .test-info h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .test-info p {
            font-size: 13px;
            color: var(--text-light);
        }

        .play-icon {
            background: var(--primary);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(251, 113, 133, 0.4);
        }

        /* TEST ENVIRONMENT */
        #test-env {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .timer {
            background: #000;
            color: #fff;
            padding: 6px 14px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            padding-bottom: 100px;
        }

        .passage-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 24px;
            line-height: 1.8;
            font-size: 15px;
            border-left: 5px solid var(--primary);
        }

        .q-block {
            margin-bottom: 25px;
        }

        .q-text {
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }

        .q-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            outline: none;
            font-size: 16px;
            margin-top: 5px;
        }

        .q-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.1);
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-prev {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-next {
            background: var(--primary);
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tiiny hide */
        div[style*="z-index: 2147483647"],
        iframe {
            border: 0 !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
</head>

<body>

    <!-- DASHBOARD: LIST OF TESTS -->
    <div id="dashboard">
        <div class="logo-area">
            <h1>IELTS <span>Prep</span></h1>
            <p>Ultimate Personal Simulation Hub</p>
        </div>

        <div class="test-grid" id="test-list">
            <!-- Tests will flow here -->
            <div class="test-card" onclick="openTest(0)">
                <div class="test-info">
                    <h3>Full Mock Test #1</h3>
                    <p>40 L • 40 R • Writing Task</p>
                </div>
                <div class="play-icon">▶</div>
            </div>
        </div>
    </div>

    <!-- TEST ENVIRONMENT -->
    <div id="test-env">
        <header>
            <div style="font-weight: 800; font-size: 14px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px;"
                id="mode-label">Listening</div>
            <div class="timer" id="timer">40:00</div>
        </header>

        <div class="content-scroll">
            <div id="audio-area" class="hidden">
                <audio id="player" controls style="width: 100%; margin-bottom: 24px; border-radius: 12px;"></audio>
            </div>
            <div id="render-area"></div>
        </div>

        <div class="footer">
            <button class="btn btn-prev" onclick="moveStep(-1)">Previous</button>
            <button class="btn btn-next" onclick="moveStep(1)">Next Part</button>
        </div>
    </div>

    <!-- DATA STORAGE -->
    <script id="mock-library-script" type="application/json">
    [
        {
            "id": 1,
            "title": "Full Mock Test #1",
            "listening": { "audio": "", "parts": ["<p>Welcome to Test 1. Answer questions 1-10.</p> [___] [___] [___]"] },
            "reading": { "parts": [{"passage": "Human history...", "questions": "Question 1: [___]"}] },
            "writing": { "prompt": "Education is important. Agree or Disagree?" }
        }
    ]
    </script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let LIBRARY = [];
        let currentTest = null;
        let mode = 'listening'; // listening, reading, writing
        let part = 0;
        let seconds = 0;
        let timerID = null;

        // LOAD DATA
        window.onload = () => {
            try {
                const raw = document.getElementById('mock-library-script').textContent;
                LIBRARY = JSON.parse(raw);
                renderLibrary();
            } catch (e) { console.error("Data error"); }
        };

        function renderLibrary() {
            const list = document.getElementById('test-list');
            list.innerHTML = LIBRARY.map((t, i) => `
                <div class="test-card" onclick="openTest(${i})">
                    <div class="test-info">
                        <h3>${t.title}</h3>
                        <p>Full 40:40 Simulation</p>
                    </div>
                    <div class="play-icon">▶</div>
                </div>
            `).join('');
        }

        function openTest(idx) {
            currentTest = LIBRARY[idx];
            tg.expand();
            try { tg.requestFullscreen(); } catch (e) { }

            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('test-env').style.display = 'flex';

            initSection('listening');
        }

        function initSection(s) {
            mode = s; part = 0;
            document.getElementById('mode-label').textContent = s;

            if (s === 'listening') {
                seconds = 40 * 60;
                document.getElementById('audio-area').classList.remove('hidden');
                document.getElementById('player').src = currentTest.listening.audio;
            } else {
                seconds = 60 * 60;
                document.getElementById('audio-area').classList.add('hidden');
            }

            renderPart();
            startTimer();
        }

        function renderPart() {
            const area = document.getElementById('render-area');
            area.innerHTML = '';
            const data = currentTest[mode];

            if (mode === 'writing') {
                area.innerHTML = `<div class="passage-box"><b>Prompt:</b><br>${data.prompt}</div><textarea style="width:100%; height:350px; border-radius:18px; padding:20px; border:1px solid #e2e8f0; font-size:16px; outline:none;" placeholder="Type your essay..."></textarea>`;
                return;
            }

            let rawHTML = "";
            let qStart = (part * 10) + 1;

            if (mode === 'reading') {
                const block = data.parts[part] || { passage: "", questions: "" };
                rawHTML = `<div class="passage-box">${block.passage}</div><div>${block.questions}</div>`;
            } else {
                rawHTML = data.parts[part] || "";
            }

            // SMART INPUTS
            let processed = rawHTML.replace(/\[___\]/g, () => {
                const el = `<div class="q-block"><span class="q-text">${qStart}. Type your answer:</span><input type="text" class="q-input"></div>`;
                qStart++;
                return el;
            });

            area.innerHTML = processed;
            area.scrollTop = 0;
        }

        function moveStep(dir) {
            const maxParts = mode === 'listening' ? 4 : (mode === 'reading' ? 3 : 1);
            let nextPart = part + dir;

            if (nextPart >= 0 && nextPart < maxParts) {
                part = nextPart;
                renderPart();
            } else if (nextPart >= maxParts) {
                if (mode === 'listening') initSection('reading');
                else if (mode === 'reading') initSection('writing');
                else { finishTest(); }
            }
        }

        function startTimer() {
            if (timerID) clearInterval(timerID);
            timerID = setInterval(() => {
                if (seconds <= 0) { moveStep(1); return; }
                seconds--;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                document.getElementById('timer').textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        function finishTest() {
            alert("Test Complete! Sent for evaluation.");
            tg.close();
        }
    </script>
</body>

</html>
